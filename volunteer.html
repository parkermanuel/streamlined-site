<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Volunteer phone view</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="./support.js"></script>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#14161B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Streamlined"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8FA}
a{color:#2E55E6}a:hover{color:#1E3FB8}
.lg,.lg-on{appearance:none;border:0;font:700 13px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:999px;cursor:pointer;min-height:36px}
.lg{background:transparent;color:#5B6270}
.lg-on{background:#FFFFFF;color:#14161B;box-shadow:0 1px 2px rgba(20,22,27,.15)}
.b1,.b2,.b2-done{appearance:none;font:700 14px/1 Inter,system-ui,sans-serif;padding:12px 14px;border-radius:12px;cursor:pointer;min-height:48px;flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px}
.b1{background:#2E55E6;color:#FFFFFF;border:0}
.b2{background:#FFFFFF;color:#14161B;border:1px solid #D5D9E0}
.b2-done{background:#E3F4EA;color:#17603C;border:1px solid #B9E2C9}
input{font:400 16px/1.4 Inter,system-ui,sans-serif;color:#14161B;background:#FFFFFF;border:1px solid #D5D9E0;border-radius:12px;padding:14px;box-sizing:border-box;width:100%;min-height:52px}
</style>
</helmet>
<div lang="{{ t.lang }}" style="width: 390px; height: 844px; overflow-y: auto; background: #F7F8FA; font-family: Inter, system-ui, sans-serif; color: #14161B; box-sizing: border-box; display: flex; flex-direction: column;">

<header style="background: #FFFFFF; border-bottom: 1px solid #E4E6EB; padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 2;">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#14161B"></rect><path d="M7 9.5c7 0 8 6.5 18 6.5M7 22.5c7 0 8-6.5 18-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><path d="M7 16h18" fill="none" stroke="#7C9BFF" stroke-width="2.4" stroke-linecap="round"></path></svg>
<span style="flex: 1 1 auto; font: 800 17px/1 Manrope, Inter, sans-serif;">Harbor Church</span>
<div role="group" aria-label="Language" style="display: flex; gap: 2px; background: #EEF0F4; padding: 3px; border-radius: 999px;">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="2"><button type="button" class="{{ l.cls }}" onClick="{{ l.pick }}">{{ l.label }}</button></sc-for>
</div>
</header>

<sc-if value="{{ isSignin }}" hint-placeholder-val="{{ true }}">
<main style="padding: 28px 18px; display: flex; flex-direction: column; gap: 16px;">
<h1 style="margin: 0; font: 800 28px/1.1 Manrope, Inter, sans-serif; letter-spacing: -0.02em;">{{ t.signTitle }}</h1>
<p style="margin: 0; font-size: 16px; color: #3A404C; line-height: 1.5;">{{ t.signBody }}</p>
<label for="vem" style="font: 600 14px/1 Inter, sans-serif; color: #3A404C;">{{ t.email }}</label>
<input id="vem" type="email" placeholder="you@email.com">
<button type="button" class="b1" onClick="{{ sendLink }}" style="flex: 0 0 auto; min-height: 52px; font-size: 16px;">{{ t.sendLink }}</button>
<span style="font-size: 13px; color: #5B6270;">{{ t.noPassword }}</span>
</main>
</sc-if>

<sc-if value="{{ isSent }}" hint-placeholder-val="{{ false }}">
<main style="padding: 28px 18px; display: flex; flex-direction: column; gap: 16px;">
<h1 style="margin: 0; font: 800 28px/1.1 Manrope, Inter, sans-serif;">{{ t.checkTitle }}</h1>
<p style="margin: 0; font-size: 16px; color: #3A404C; line-height: 1.5;">{{ t.checkBody }}</p>
<button type="button" class="b1" onClick="{{ openLink }}" style="flex: 0 0 auto; min-height: 52px; font-size: 16px;">{{ t.openLink }}</button>
</main>
</sc-if>

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
<main style="padding: 20px 16px 90px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="align-self: flex-start; font: 700 12px/1 Inter, sans-serif; color: #1E3FB8; background: #EAF0FF; padding: 7px 10px; border-radius: 999px;">{{ t.team }}</span>
<h1 style="margin: 0; font: 800 26px/1.15 Manrope, Inter, sans-serif; letter-spacing: -0.02em;">{{ t.homeTitle }}</h1>
<p style="margin: 0; font-size: 15px; color: #3A404C; line-height: 1.45;">{{ t.homeBody }}</p>
</div>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E4E6EB; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
<div style="height: 170px; background: {{ it.bg }}; color: #FFFFFF; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; box-sizing: border-box; border-bottom: 6px solid #E8674A;">
<span style="font: 800 24px/1.05 Manrope, sans-serif; text-transform: uppercase;">{{ it.headline }}</span>
<span style="font: 600 13px/1.3 Inter, sans-serif; color: #F3E9DC;">{{ it.when }}</span>
</div>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px;"><strong style="flex: 1 1 auto; font-size: 15px;">{{ it.title }}</strong><span style="font: 600 12px/1 Inter, sans-serif; color: #8A4B00; background: #FFF1DB; padding: 6px 8px; border-radius: 999px; white-space: nowrap;">{{ it.postBy }}</span></div>
<p style="margin: 0; font-size: 14px; color: #3A404C; line-height: 1.45; background: #F7F8FA; border-radius: 10px; padding: 10px 12px;">{{ it.caption }}</p>
<div style="display: flex; gap: 8px;">
<button type="button" class="b1">{{ t.save }}</button>
<button type="button" class="{{ it.copyCls }}" onClick="{{ it.copy }}">{{ it.copyLabel }}</button>
</div>
</div>
</article>
</sc-for>
<span style="font-size: 13px; color: #5B6270; text-align: center;">{{ t.viewOnly }}</span>
</main>
</sc-if>
</div>
<a href="demo.html" style="position: fixed; right: 12px; bottom: 12px; z-index: 20; display: inline-flex; align-items: center; background: #14161B; color: #FFFFFF; text-decoration: none; font: 700 13px/1 Inter, sans-serif; padding: 12px 14px; border-radius: 999px; box-shadow: 0 6px 18px rgba(20,22,27,.25); min-height: 44px; box-sizing: border-box;">{{ t.switchRole }}</a>
<sc-if value="{{ uHas }}" hint-placeholder-val="{{ false }}">
<div role="status" aria-live="polite" style="position: fixed; left: 16px; right: 16px; bottom: 76px; z-index: 40; max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; background: #14161B; color: #FFFFFF; border-radius: 12px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(20,22,27,.3); box-sizing: border-box;"><span style="flex: 1 1 auto; font: 500 14px/1.4 Inter, sans-serif;">{{ uMsg }}</span><button type="button" onClick="{{ uGo }}" style="appearance: none; flex: 0 0 auto; border: 0; background: #7C9BFF; color: #14161B; font: 700 14px/1 Inter, sans-serif; padding: 11px 16px; border-radius: 10px; min-height: 44px; cursor: pointer;">Undo</button></div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'signin', lang: 'en', copied: {} };
  }
  renderVals() {
    var s = this.state, self = this;
    var es = s.lang === 'es';
    var t = es ? {
      lang: 'es', signTitle: 'Comparte lo que se viene', signBody: 'Todo lo que tu equipo puede publicar esta semana, aprobado y listo.', email: 'Tu correo',
      sendLink: 'Enviarme un enlace', noPassword: 'Sin contraseña. Te enviamos un enlace seguro que vence en 15 minutos.',
      checkTitle: 'Revisa tu correo', checkBody: 'Toca el enlace del correo para entrar en este teléfono.', openLink: 'Abrir enlace (demo)',
      team: 'Equipo de Niños · Campus Norte', homeTitle: 'Listo para publicar', homeBody: 'Aprobado por Comunicaciones. Guarda la imagen, copia el texto y publícalo.',
      save: 'Guardar imagen', viewOnly: 'Solo puedes ver y descargar. Para pedir algo nuevo, habla con el líder de tu equipo.', switchRole: 'Cambiar rol'
    } : {
      lang: 'en', signTitle: "Share what's coming up", signBody: 'Everything your team can post this week, approved and ready.', email: 'Your email',
      sendLink: 'Email me a sign-in link', noPassword: 'No password. We email you a secure link that expires in 15 minutes.',
      checkTitle: 'Check your email', checkBody: 'Tap the link in the email to sign in on this phone.', openLink: 'Open link (demo)',
      team: 'Kids team · North Campus', homeTitle: 'Ready to post', homeBody: 'Approved by Comms. Save the image, copy the caption and post it.',
      save: 'Save image', viewOnly: 'You can view and download. To ask for something new, talk to your team lead.', switchRole: 'Switch role'
    };
    var langs = [{ id: 'en', label: 'EN' }, { id: 'es', label: 'ES' }].map(function (l) {
      return { label: l.label, cls: s.lang === l.id ? 'lg-on' : 'lg', pick: function () { self.setState({ lang: l.id }); } };
    });
    var defs = es ? [
      ['fest', 'Festival de Otoño', 'sáb 31 de oct · 4–7 PM', 'Historia de Instagram', 'Publicar antes del jue', '¡Trae a toda la familia al Festival de Otoño! Comida, inflables y dulces. Gratis. Sábado 31 de octubre, 4–7 PM.', '#1C2B4A'],
      ['bap', 'Domingo de Bautismos', 'dom 15 de nov', 'Publicación cuadrada', 'Publicar antes del 13 de nov', 'Este domingo celebramos vidas cambiadas. Ven a ser parte del Domingo de Bautismos.', '#0F6E7A'],
      ['serve', 'Domingo de Servicio', 'dom 16 de nov', 'Historia de Instagram', 'Publicar antes del sáb', 'Encuentra tu lugar para servir este domingo. Te esperamos.', '#4B53BC']
    ] : [
      ['fest', 'Fall Fest', 'Sat, Oct 31 · 4–7 PM', 'Instagram story', 'Post by Thu', 'Bring the whole family to Fall Fest! Food trucks, bounce houses and trunk-or-treat. Free. Saturday, Oct 31, 4–7 PM.', '#1C2B4A'],
      ['bap', 'Baptism Sunday', 'Sun, Nov 15', 'Square post', 'Post by Nov 13', 'This Sunday we celebrate changed lives. Come be part of Baptism Sunday.', '#0F6E7A'],
      ['serve', 'Serve Sunday', 'Sun, Nov 16', 'Instagram story', 'Post by Sat', 'Find your place to serve this Sunday. We saved you a spot.', '#4B53BC']
    ];
    var items = defs.map(function (d) {
      var done = !!s.copied[d[0]];
      return { headline: d[1], when: d[2], title: d[3], postBy: d[4], caption: d[5], bg: d[6],
        copyCls: done ? 'b2-done' : 'b2', copyLabel: done ? (es ? 'Copiado' : 'Copied') : (es ? 'Copiar texto' : 'Copy caption'),
        copy: function () { var n = Object.assign({}, s.copied); n[d[0]] = true; self.setState({ copied: n }); } };
    });
    return {
      t: t, langs: langs, items: items,
      isSignin: s.step === 'signin', isSent: s.step === 'sent', isHome: s.step === 'home',
      sendLink: function () { self.act({ step: 'sent' }, 'Link sent.'); },
      openLink: function () { self.setState({ step: 'home' }); }
    };
  }
}

(function (P) {
  var orig = P.renderVals;
  P.act = function (patch, msg) {
    var self = this, prev = {};
    Object.keys(patch).forEach(function (k) { prev[k] = self.state[k]; });
    clearTimeout(this._undoT);
    this.setState(Object.assign({}, patch, { _undo: { prev: prev, msg: msg } }));
    this._undoT = setTimeout(function () { self.setState({ _undo: null }); }, 8000);
  };
  P.renderVals = function () {
    var v = orig.call(this), self = this, u = this.state && this.state._undo;
    v.uHas = !!u; v.uMsg = u ? u.msg : '';
    v.uGo = function () { clearTimeout(self._undoT); var p = self.state._undo ? self.state._undo.prev : {}; self.setState(Object.assign({}, p, { _undo: null })); };
    return v;
  };
})(Component.prototype);
</script>
</body>
</html>
